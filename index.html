<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSnew — 主页</title>
<style>
:root{--bg:#f4f7fa;--w:#fff;--b1:#1a73e8;--b2:#4a9ff5;--b3:#7ec8f8;--b4:#00bcd4;--bl:#e8f4fd;--dk:#1a2332;--t:#2c3e50;--t2:#6b7c93;--r:18px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--t);font-family:-apple-system,"SF Pro Display","PingFang SC",system-ui,sans-serif;line-height:1.6;overflow-x:hidden}

/* Progress */
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--b1),var(--b4));z-index:200;width:0;transition:width .15s;border-radius:0 2px 2px 0}

/* Island */
.island{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;background:var(--dk);color:#fff;border-radius:30px;padding:0 12px;height:8px;display:flex;align-items:center;gap:0;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.15);min-width:60px;width:60px;overflow:hidden;white-space:nowrap}
.island.show{opacity:1}
.island.bar{height:8px;width:120px;padding:0;border-radius:4px;gap:0}
.island.bar *{opacity:0;transition:opacity .2s}
.island.expanded{height:48px;width:auto;min-width:300px;padding:0 28px;border-radius:26px;gap:18px;pointer-events:auto}
.island.expanded *{opacity:1;transition:opacity .3s .15s}
.island .dot{width:8px;height:8px;background:var(--b2);border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
.island a{color:rgba(255,255,255,.7);text-decoration:none;transition:color .3s;font-size:13px}
.island a:hover{color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Hero compact */
.hero{padding:80px 0 40px;text-align:center;background:var(--w);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(74,159,245,.12),transparent 70%);top:-100px;right:-50px;animation:drift 12s ease-in-out infinite}
.hero::after{content:'';position:absolute;width:250px;height:250px;background:radial-gradient(circle,rgba(0,188,212,.08),transparent 70%);bottom:-50px;left:-30px;animation:drift 10s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-15px)}}
.hero h1{font-size:clamp(2rem,4vw,3rem);font-weight:800;color:var(--dk);letter-spacing:-.03em;opacity:0;animation:springIn .8s cubic-bezier(.34,1.56,.64,1) .2s forwards}
.hero .sub{color:var(--t2);font-size:1rem;margin-top:8px;opacity:0;animation:springIn .8s cubic-bezier(.34,1.56,.64,1) .4s forwards}
@keyframes springIn{0%{opacity:0;transform:translateY(30px) scale(.95)}60%{transform:translateY(-4px) scale(1.01)}100%{opacity:1;transform:none}}

/* Layout */
.container{max-width:1100px;margin:0 auto;padding:0 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}

/* Section */
section{padding:48px 0}
.stitle{font-size:1.4rem;font-weight:700;color:var(--dk);margin-bottom:24px;display:flex;align-items:center;gap:10px}
.stitle .bar{width:32px;height:3px;background:var(--b1);border-radius:2px}

/* Card base */
.card{background:var(--w);border-radius:var(--r);padding:24px;border:1px solid #e8edf2;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(26,115,232,.1);border-color:var(--b2)}
.card:active{transform:translateY(-3px) scale(.98);transition:all .12s}
a.card{text-decoration:none;color:inherit;display:block;cursor:pointer}

/* Dashboard cards */
.dash-card{position:relative;overflow:hidden}
.dash-card .icon{font-size:28px;margin-bottom:10px;display:block}
.dash-card h3{font-size:1rem;color:var(--dk);margin-bottom:4px}
.dash-card p{font-size:12px;color:var(--t2)}
.dash-card .status{position:absolute;top:16px;right:16px;width:10px;height:10px;border-radius:50%}
.status.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.4)}
.status.off{background:#ef4444}

/* Activity feed */
.feed-item{padding:12px 0;border-bottom:1px solid #f0f2f5;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.feed-item:last-child{border:none}
.feed-dot{width:8px;height:8px;border-radius:50%;background:var(--b1);margin-top:5px;flex-shrink:0}
.feed-date{color:var(--t2);font-size:11px;margin-top:2px}

/* Machine stats */
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.m-stat{background:var(--w);border-radius:14px;padding:16px;text-align:center;border:1px solid #e8edf2}
.m-stat .val{font-size:1.4rem;font-weight:800;color:var(--b1)}
.m-stat .lbl{font-size:11px;color:var(--t2);margin-top:2px}

/* Services */
.svc-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.svc{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.svc.on{background:#dcfce7;color:#166534}
.svc.off{background:#fee2e2;color:#991b1b}

/* Wiki */
.wiki-search{display:flex;gap:10px;margin-bottom:16px}
.wiki-search input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid #e0e5ec;font-size:14px;outline:none;transition:border .3s}
.wiki-search input:focus{border-color:var(--b1)}
.wiki-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.wiki-tab{padding:6px 16px;border-radius:20px;border:1px solid #e0e5ec;font-size:13px;cursor:pointer;transition:all .3s;background:var(--w)}
.wiki-tab.active,.wiki-tab:hover{background:var(--b1);color:#fff;border-color:var(--b1)}
.wiki-result{padding:12px;border-bottom:1px solid #f0f2f5;font-size:13px}

/* Mini project */
.mini-proj{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f2f5}
.mini-proj:last-child{border:none}
.mini-proj .lang-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mini-proj a{color:var(--dk);font-weight:600;text-decoration:none;font-size:14px}
.mini-proj a:hover{color:var(--b1)}

/* Scroll reveal */
.rv{opacity:0;transform:translateY(24px);transition:all .7s cubic-bezier(.34,1.56,.64,1)}
.rv.v{opacity:1;transform:none}

/* Footer */
footer{text-align:center;padding:40px;color:var(--t2);font-size:12px;border-top:1px solid #e8edf2;margin-top:40px}
</style>
</head>
<body>

<div id="progress"></div>
<nav class="island" id="island">
  <span class="dot"></span><span>RSnew</span>
  <a href="#dash">仪表盘</a><a href="#activity">动态</a><a href="#wiki">Wiki</a><a href="#projects">项目</a>
</nav>

<!-- Hero -->
<div class="hero">
  <h1>RSnew</h1>
  <p class="sub">构建者 · 探索者 · 语言设计师</p>
</div>

<div class="container">

<!-- Dashboard -->
<section id="dash">
  <h2 class="stitle rv"><span class="bar"></span>仪表盘</h2>
  <div class="grid3 rv" id="dash-cards">
    <a class="card dash-card" href="https://github.com/RSnew/Flux" target="_blank">
      <span class="icon">🔥</span><h3>Flux 语言</h3><p>自研编程语言</p>
    </a>
    <div class="card dash-card" onclick="window.open('http://localhost:8088','_blank')">
      <span class="status" id="svc-promptcraft"></span>
      <span class="icon">🧪</span><h3>PromptCraft</h3><p>AI 编程挑战平台</p>
    </div>
    <div class="card dash-card" onclick="window.open('http://localhost:8095','_blank')">
      <span class="status" id="svc-qqbot"></span>
      <span class="icon">🤖</span><h3>QQ 机器人</h3><p>小二妹妹</p>
    </div>
    <div class="card dash-card" onclick="window.open('http://localhost:9877','_blank')">
      <span class="status" id="svc-danmaku"></span>
      <span class="icon">💬</span><h3>弹幕覆盖</h3><p>B站直播弹幕</p>
    </div>
    <a class="card dash-card" href="https://github.com/RSnew/xiaoerGame" target="_blank">
      <span class="icon">🎮</span><h3>xiaoerGame</h3><p>Rust 游戏</p>
    </a>
    <a class="card dash-card" href="https://github.com/RSnew/ImNotThinkingWhatIWant" target="_blank">
      <span class="icon">📱</span><h3>iOS App</h3><p>Swift 应用</p>
    </a>
  </div>
</section>

<!-- Machine Status -->
<section id="machine">
  <h2 class="stitle rv"><span class="bar"></span>本机状态</h2>
  <div class="grid2 rv">
    <div>
      <div class="machine-grid" id="machine-stats">
        <div class="m-stat"><div class="val" id="m-uptime">-</div><div class="lbl">运行时间</div></div>
        <div class="m-stat"><div class="val" id="m-cpu">-</div><div class="lbl">CPU</div></div>
        <div class="m-stat"><div class="val" id="m-mem">-</div><div class="lbl">内存</div></div>
        <div class="m-stat"><div class="val" id="m-disk">-</div><div class="lbl">磁盘剩余</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:10px;color:var(--dk)">服务状态</h3>
      <div class="svc-row" id="svc-list"></div>
      <p style="font-size:11px;color:var(--t2);margin-top:12px" id="m-updated"></p>
    </div>
  </div>
</section>

<!-- Activity -->
<section id="activity">
  <h2 class="stitle rv"><span class="bar"></span>最新动态</h2>
  <div class="card rv" id="feed">
    <div style="color:var(--t2);font-size:13px">加载中...</div>
  </div>
</section>

<!-- Game Wiki -->
<section id="wiki">
  <h2 class="stitle rv"><span class="bar"></span>游戏 Wiki</h2>
  <div class="card rv">
    <div class="wiki-tabs" id="wiki-tabs">
      <span class="wiki-tab active" data-game="xiaoerGame">xiaoerGame</span>
      <span class="wiki-tab" data-game="taiko">太鼓达人</span>
    </div>
    <div class="wiki-search">
      <input type="text" id="wiki-input" placeholder="搜索 Wiki...">
    </div>
    <div id="wiki-results">
      <div class="wiki-result" style="color:var(--t2)">输入关键词搜索游戏相关内容</div>
    </div>
  </div>
</section>

<!-- Projects (compact) -->
<section id="projects">
  <h2 class="stitle rv"><span class="bar"></span>项目</h2>
  <div class="card rv" id="proj-list"></div>
</section>

<!-- Tech (compact) -->
<section>
  <h2 class="stitle rv"><span class="bar"></span>技术栈</h2>
  <div class="rv" style="display:flex;gap:8px;flex-wrap:wrap" id="tech-tags"></div>
</section>

</div>

<footer>纯手工打造 · 零依赖 · 极致性能</footer>

<script>
// Scroll reveal
const obs=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('v')}),{threshold:.1,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.rv').forEach(el=>obs.observe(el));

// Island + progress
const island=document.getElementById('island');
window.addEventListener('scroll',()=>{
  const s=window.scrollY,hH=300;
  document.getElementById('progress').style.width=(s/(document.documentElement.scrollHeight-innerHeight)*100)+'%';
  if(s>hH){island.classList.add('show','bar');island.classList.remove('expanded');clearTimeout(island._t);island._t=setTimeout(()=>{island.classList.remove('bar');island.classList.add('expanded')},300);}
  else{island.classList.remove('show','bar','expanded');}
});

// Machine status
async function loadStatus(){
  try{
    const r=await fetch('http://localhost:9878/api/status');
    const d=await r.json();
    document.getElementById('m-uptime').textContent=d.uptime||'-';
    document.getElementById('m-cpu').textContent=(d.cpu_pct||'-')+'%';
    document.getElementById('m-mem').textContent=(d.memory_gb||'-')+'GB';
    document.getElementById('m-disk').textContent=d.disk_free||'-';
    document.getElementById('m-updated').textContent='更新于 '+d.updated;
    const sl=document.getElementById('svc-list');
    sl.innerHTML='';
    for(const[k,v]of Object.entries(d.services||{})){
      sl.innerHTML+=`<span class="svc ${v==='online'?'on':'off'}">${v==='online'?'●':'○'} ${k}</span>`;
    }
    // Dashboard card status dots
    const map={'PromptCraft':'svc-promptcraft','QQ Bot':'svc-qqbot','Danmaku':'svc-danmaku'};
    for(const[k,id]of Object.entries(map)){
      const el=document.getElementById(id);
      if(el)el.className='status '+(d.services[k]==='online'?'on':'off');
    }
  }catch(e){document.getElementById('m-uptime').textContent='离线';}
}
loadStatus();setInterval(loadStatus,30000);

// GitHub activity
fetch('https://api.github.com/users/RSnew/events?per_page=10')
  .then(r=>r.json()).then(events=>{
    const feed=document.getElementById('feed');
    feed.innerHTML='';
    events.filter(e=>['PushEvent','PullRequestEvent','CreateEvent'].includes(e.type)).slice(0,8).forEach(e=>{
      const repo=e.repo.name.split('/')[1];
      const date=e.created_at.split('T')[0];
      let detail='';
      if(e.type==='PushEvent')detail=`推送了 ${e.payload.commits?.length||0} 个提交`;
      else if(e.type==='PullRequestEvent')detail=`${e.payload.action} PR #${e.payload.pull_request?.number}`;
      else if(e.type==='CreateEvent')detail=`创建了 ${e.payload.ref_type} ${e.payload.ref||''}`;
      feed.innerHTML+=`<div class="feed-item"><div class="feed-dot"></div><div><a href="https://github.com/${e.repo.name}" target="_blank" style="color:var(--b1);text-decoration:none;font-weight:600">${repo}</a> ${detail}<div class="feed-date">${date}</div></div></div>`;
    });
    if(!feed.innerHTML)feed.innerHTML='<div style="color:var(--t2);font-size:13px">暂无动态</div>';
  }).catch(()=>{document.getElementById('feed').innerHTML='<div style="color:var(--t2)">加载失败</div>';});

// Projects list
fetch('https://api.github.com/users/RSnew/repos?sort=updated&per_page=8')
  .then(r=>r.json()).then(repos=>{
    const el=document.getElementById('proj-list');
    el.innerHTML='';
    const colors={'C++':'#659ad2','Rust':'#dea584','Swift':'#f05230','Python':'#3572a5','Java':'#b07219','HTML':'#e34c26','Vue':'#42b883'};
    repos.forEach(r=>{
      const c=colors[r.language]||'#999';
      el.innerHTML+=`<div class="mini-proj"><span class="lang-dot" style="background:${c}"></span><a href="${r.html_url}" target="_blank">${r.name}</a><span style="color:var(--t2);font-size:12px;margin-left:auto">${r.language||''}</span></div>`;
    });
  });

// Tech tags
const techs=['C++','Rust','Swift','Python','Vue','Flutter','LLVM','Docker','Go','Java','SwiftUI','NoneBot'];
const tEl=document.getElementById('tech-tags');
techs.forEach(t=>{
  const s=document.createElement('span');
  s.textContent=t;
  s.style.cssText='padding:6px 16px;border-radius:20px;background:var(--bl);color:var(--b1);font-size:13px;font-weight:600;transition:all .4s cubic-bezier(.34,1.56,.64,1);cursor:default';
  s.onmouseenter=()=>{s.style.transform='translateY(-3px) scale(1.08)';s.style.background='var(--b1)';s.style.color='#fff';};
  s.onmouseleave=()=>{s.style.transform='';s.style.background='var(--bl)';s.style.color='var(--b1)';};
  tEl.appendChild(s);
});

// Wiki
const wikiData={
  xiaoerGame:[
    {title:'游戏概述',desc:'xiaoerGame 是一个 Rust 构建的游戏项目'},
    {title:'技术架构',desc:'使用 Rust + QQ 平台'},
    {title:'角色系统',desc:'游戏角色与交互机制'},
  ],
  taiko:[
    {title:'太鼓达人 Mac 版',desc:'TaikoMacOS — Swift + SpriteKit 重写的太鼓达人'},
    {title:'谱面格式',desc:'TJA / Fumen 谱面解析'},
    {title:'音频系统',desc:'NUS3BANK 音频格式解析与播放'},
    {title:'YIN 算法',desc:'音高检测算法实现'},
  ],
};
let currentGame='xiaoerGame';
document.querySelectorAll('.wiki-tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.wiki-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentGame=tab.dataset.game;
    renderWiki('');
  };
});
document.getElementById('wiki-input').oninput=e=>renderWiki(e.target.value);
function renderWiki(q){
  const el=document.getElementById('wiki-results');
  const items=(wikiData[currentGame]||[]).filter(i=>!q||i.title.includes(q)||i.desc.includes(q));
  if(!items.length){el.innerHTML='<div class="wiki-result" style="color:var(--t2)">没有找到相关内容</div>';return;}
  el.innerHTML=items.map(i=>`<div class="wiki-result"><strong>${i.title}</strong><br><span style="color:var(--t2)">${i.desc}</span></div>`).join('');
}
renderWiki('');
</script>
</body>
</html>
